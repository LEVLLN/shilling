[package]
name = "shilling"
version = "0.1.1"
edition = "2024"
authors = ["Lev Kudryashov <lev.kudryashov1994@gmail.com>"]
description = "Typed Telegram Bot API client with long-polling, retries, and structured updates. Named after Pavel L. Schilling, inventor of the first electromagnetic telegraph (1832)."
license = "MIT"
readme = "README.md"
repository = "https://github.com/LEVLLN/shilling"
homepage = "https://github.com/LEVLLN/shilling"
keywords = ["telegram", "bot", "long-polling", "async", "api"]
categories = ["api-bindings", "asynchronous"]
exclude = [".github/*", "src/snapshots/*"]
documentation = "https://docs.rs/shilling"

[dependencies]
once_cell = "1.21.4"
rand = "0.10.1"
reqwest = {version="0.13.3", features=["json"]}
serde = {version="1.0.228", features=["derive"]}
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
insta = { version = "1.47.2", features = ["redactions", "yaml"] }
rstest = "0.26.1"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
fallible_impl_from = "deny"
match_same_arms = "deny"
match_wildcard_for_single_variants = "deny"
if_not_else = "deny"
needless_continue = "deny"
explicit_iter_loop = "deny"
explicit_into_iter_loop = "deny"
redundant_clone = "deny"
implicit_clone = "deny"
clone_on_copy = "deny"
undocumented_unsafe_blocks = "deny"
